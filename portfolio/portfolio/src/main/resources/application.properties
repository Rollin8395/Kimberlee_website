spring.application.name=portfolio

# Datasource. Local defaults are kept so `mvnw spring-boot:run` still works with no setup;
# a deployed instance must override these with real environment variables.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/kimberlee_portfolio}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

server.address=${SERVER_ADDRESS:0.0.0.0}
# Most hosts inject the port to bind to as $PORT.
server.port=${PORT:8080}

# Comma-separated list of browser origins allowed to call /api/**.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://172.20.10.2:3000}
